schema: workflow/2022.04
name: Xero Authentication
settings:
  error_notification: true
  lambda_memory: 512
triggers:
- id: hi_BpHaLee
steps:
- namespace: getCodeAndState
  runtime: python3.12
  uses: "./getCodeAndState/entry.py"
- namespace: updateXeroAuthorizartionCodes
  runtime: nodejs20.x
  uses: data_stores-add-update-record@0.0.9
  props:
    dataStore:
      storeId: ds_1OuaeN
    key: "{{steps.getCodeAndState.$return_value.State}}"
    value: "{{steps.getCodeAndState.$return_value.code}}"
- namespace: getAccessToken
  runtime: python3.12
  uses: "./getAccessToken/entry.py"
- namespace: updateXeroAccessTokens
  runtime: nodejs20.x
  uses: data_stores-add-update-record@0.0.9
  props:
    dataStore:
      storeId: ds_9PudAG
    key: "{{steps.getCodeAndState.$return_value.State}}"
    value: "{\"access_token\": \"{{steps.getAccessToken.$return_value.access_token}}\",
      \n\"refresh_token\": \"{{steps.getAccessToken.$return_value.refresh_token}}\"}"
- namespace: get_user_info
  runtime: nodejs20.x
  uses: "./get_user_info/entry.js"
- namespace: tenant_auth_setup
  runtime: nodejs20.x
  uses: "./tenant_auth_setup/entry.js"
  props:
    xeroAuthorizationCodes:
      storeId: ds_1OuaeN
    xeroAccessTokens:
      storeId: ds_9PudAG
- namespace: notify_internally
  runtime: nodejs20.x
  uses: microsoft_teams-send-chat-message@0.0.8
  props:
    microsoftTeams:
      authProvisionId: apn_mnhG0ry
    chatId:
      __lv:
        label: Tal Mirzai, Complyt Integrations
        value: 19:119e1794-2914-4e98-8bea-838333056007_e98deb43-2b38-42b8-8925-57658a059114@unq.gbl.spaces
    message: "<div style=\"font-family: sans-serif; font-size: 14px; line-height:
      1.5; padding: 16px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius:
      8px; max-width: 600px;\">\n  <div style=\"font-size: 16px; font-weight: bold;
      margin-bottom: 10px;\">\U0001F517 New Xero Connection</div>\n  <p>A new user
      has connected the Complyt app to their Xero account.</p>\n\n  <p><strong>Connected
      by:</strong> {{steps.get_user_info.$return_value.user.name}} (<a href=\"mailto:{{steps.get_user_info.$return_value.user.email}}\">{{steps.get_user_info.$return_value.user.email}}</a>)</p>\n
      \ <p><strong>Xero User ID:</strong> {{steps.get_user_info.$return_value.user.xero_userid}}</p>\n
      \ <p><strong>Connection Time (UTC):</strong> {{steps.get_user_info.$return_value.newlyConnectedTenants[0].updatedDateUtc}}</p>\n\n
      \ <p><strong>Tenant Name:</strong> {{steps.get_user_info.$return_value.newlyConnectedTenants[0].tenantName}}</p>\n
      \ <p><strong>Tenant ID:</strong> {{steps.get_user_info.$return_value.newlyConnectedTenants[0].tenantId}}</p>\n
      \ <p><strong>Auth Event ID:</strong> {{steps.get_user_info.$return_value.newlyConnectedTenants[0].authEventId}}</p>\n\n
      \ <hr style=\"margin: 20px 0; border: none; border-top: 1px solid #ccc;\">\n\n
      \ <p><strong>\U0001F464 Sales follow-up needed:</strong> Who from the sales
      team will reach out to <a href=\"mailto:{{steps.get_user_info.$return_value.user.email}}\">{{steps.get_user_info.$return_value.user.email}}</a>?</p>\n\n
      \ <p style=\"font-size: 12px; color: #888;\">This notification was generated
      automatically.</p>\n</div>\n"
    contentType: html
