schema: workflow/2022.04
name: Import Customers To Complyt
settings:
  error_notification: true
  lambda_timeout: 514
triggers:
- id: hi_xQHQgPk
steps:
- namespace: get_xero_access_token
  runtime: nodejs20.x
  uses: data_stores-get-all-records@0.0.2
  props:
    dataStore:
      storeId: ds_9PudAG
- namespace: get_xero_customers
  runtime: nodejs20.x
  uses: http-get-request@1.1.1
  props:
    httpRequest:
      auth:
        type: none
        username: ''
        password: ''
        token:
      body:
        contentType: none
        fields: []
        mode: fields
        type: raw
      headers:
      - name: xero-tenant-id
        value: "{{steps.trigger.event.body.tenantId}}"
      - name: Content-Type
        value: application/json
      - name: Accept
        value: application/json
      - name: Authorization
        value: Bearer {{steps.get_xero_access_token.$return_value.Connection.access_token}}
      method: GET
      params:
      - name: ''
        value: ''
        disabled: true
      url: https://api.xero.com/api.xro/2.0/contacts?where=isCustomer=true
      tab: Headers
- namespace: send_contact_IDs_to_main_gateway
  runtime: nodejs20.x
  uses: "./send_contact_IDs_to_main_gateway/entry.js"
- namespace: code
  disabled: true
  runtime: python3.12
  uses: "./code/entry.py"

